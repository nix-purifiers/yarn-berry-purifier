# SPDX-License-Identifier: MIT
#
# Runs every check of the flake on x86_64-linux and aarch64-linux, then the
# parts of the conformance checks that need Nix or the network outside the
# sandbox. The relock is the flake check conformance-relock, a
# fixed-output build.
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - run: nix flake check -L
      # A second build of the app fixture's package gives the same output.
      - name: conformance-rebuild
        run: |
          system="$(nix config show system)"
          nix build --rebuild -L ".#checks.$system.conformance-rebuild"
      # After `yarn-berry-purifier prefetch`, the yarn wrapper installs and
      # builds the app fixture with the network cut off.
      - name: conformance-offline
        run: |
          cp -r tests/fixtures/app "$RUNNER_TEMP/app"
          chmod -R u+w "$RUNNER_TEMP/app"
          nix build --out-link "$RUNNER_TEMP/yarn" "$GITHUB_WORKSPACE#yarn"
          cd "$RUNNER_TEMP/app"
          nix run "$GITHUB_WORKSPACE#yarn-berry-purifier" -- prefetch
          sudo unshare -n sudo -u "$USER" env "PATH=$PATH" "HOME=$HOME" \
            sh -c "$RUNNER_TEMP/yarn/bin/yarn install --immutable && $RUNNER_TEMP/yarn/bin/yarn run build"
