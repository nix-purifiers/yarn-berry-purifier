# SPDX-License-Identifier: MIT
name: release

on:
  workflow_run:
    workflows: [check]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    permissions:
      contents: write
      actions: write
    uses: nix-purifiers/nix-purifiers.github.io/.github/workflows/purifier-release.yml@5c1c892adbc9b1b34d6cd3db57e15ebbc7aa6a32
    with:
      infrastructure_ref: 5c1c892adbc9b1b34d6cd3db57e15ebbc7aa6a32
      sha: ${{ github.event.workflow_run.head_sha || github.sha }}
      kind: yarn
      series: '0.1'
